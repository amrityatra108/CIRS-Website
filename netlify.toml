# The repository root holds the generated pages next to the scripts that
# build them, so publishing the root would ship tools/, .github/ and
# node_modules alongside the site. tools/stage-deploy.py copies just the
# publishable files into _site/, and this points Netlify at that.
#
# _site/ is generated and git-ignored: run the two commands below before
# deploying, or let the build command do it.
#
# Kept in step with vercel.json, with two deliberate differences (HOSTING.md):
# the build command here has no --vercel, because _headers is this host's file;
# and there is no trailing-slash setting, because Netlify already redirects
# /page/ to /page by itself and normalises the slash before redirects are read.
# 404.html needs nothing here: Netlify serves it for any unknown path.

[build]
  command = "python3 tools/build-site.py && python3 tools/stage-deploy.py"
  publish = "_site"

[[redirects]]
  from = "/student-life.html"
  to = "/the-cirs-experience.html"
  status = 301

[[redirects]]
  from = "/student-life"
  to = "/the-cirs-experience.html"
  status = 301

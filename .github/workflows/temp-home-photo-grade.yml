name: Temporary Home Photo Grade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  grade:
    if: "!startsWith(github.event.head_commit.message, 'chore: grade home scroll photos')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --quiet Pillow numpy
      - name: Apply bright airy Lightroom-style grade
        run: |
          python - <<'PY'
          import colorsys, os, subprocess
          from PIL import Image, ImageEnhance, ImageFilter, ImageOps
          import numpy as np

          files = [
              "assets/img/hrun/01-holi.jpg",
              "assets/img/hrun/02-window.jpg",
              "assets/img/hrun/03-campus.jpg",
              "assets/img/hrun/05-lab.jpg",
              "assets/img/hrun/06-swim.jpg",
              "assets/img/hrun/07-sparkler.jpg",
              "assets/img/hrun/08-candlelight.jpg",
              "assets/img/hrun/09-meditation.jpg",
              "assets/img/hrun/10-stage.jpg",
          ]

          def smoothstep(a, b, x):
              t = np.clip((x-a)/(b-a), 0, 1)
              return t*t*(3-2*t)

          def hsl_adjust(rgb, hue_shift, sat_delta, lum_delta, center, width):
              arr = rgb / 255.0
              mx = arr.max(axis=2); mn = arr.min(axis=2)
              l = (mx+mn)/2
              d = mx-mn
              s = np.zeros_like(l)
              mask = d > 1e-6
              s[mask] = d[mask] / (1-np.abs(2*l[mask]-1)+1e-6)
              h = np.zeros_like(l)
              r,g,b = arr[:,:,0],arr[:,:,1],arr[:,:,2]
              mr = (mx==r)&mask; mg=(mx==g)&mask; mb=(mx==b)&mask
              h[mr] = ((g[mr]-b[mr])/d[mr])%6
              h[mg] = ((b[mg]-r[mg])/d[mg])+2
              h[mb] = ((r[mb]-g[mb])/d[mb])+4
              h /= 6.0
              dist = np.minimum(np.abs(h-center), 1-np.abs(h-center))
              w = np.clip(1-dist/width,0,1)
              s = np.clip(s + sat_delta*w,0,1)
              l = np.clip(l + lum_delta*w,0,1)
              # HSL -> RGB
              def hue2rgb(p,q,t):
                  t=t%1
                  return np.where(t<1/6,p+(q-p)*6*t,
                         np.where(t<1/2,q,
                         np.where(t<2/3,p+(q-p)*(2/3-t)*6,p)))
              q=np.where(l<0.5,l*(1+s),l+s-l*s)
              p=2*l-q
              out=np.empty_like(arr)
              ach=(s<1e-6)
              out[:,:,0]=np.where(ach,l,hue2rgb(p,q,h+1/3))
              out[:,:,1]=np.where(ach,l,hue2rgb(p,q,h))
              out[:,:,2]=np.where(ach,l,hue2rgb(p,q,h-1/3))
              return np.clip(out*255,0,255)

          for path in files:
              im = ImageOps.exif_transpose(Image.open(path)).convert("RGB")
              a = np.asarray(im).astype(np.float32)
              x = a/255.0

              # Lightroom-style Light panel:
              # Exposure +0.30, Contrast -4, Highlights -18,
              # Shadows +22, Whites +8, Blacks +5.
              x = np.clip(x * (2**0.30), 0, 1)
              x = np.clip((x-0.5)*0.96 + 0.5, 0, 1)
              lum = 0.2126*x[:,:,0] + 0.7152*x[:,:,1] + 0.0722*x[:,:,2]
              shadow = (1-smoothstep(0.16,0.62,lum))**1.35
              high = smoothstep(0.42,0.92,lum)**1.35
              x += shadow[:,:,None]*0.070
              x -= high[:,:,None]*0.055
              x += (1-lum)[:,:,None]*0.012
              x += lum[:,:,None]*0.018

              # Warm, clean white balance: Temp +4, Tint +2.
              x[:,:,0] *= 1.018
              x[:,:,1] *= 0.997
              x[:,:,2] *= 0.982

              a = np.clip(x*255,0,255)
              # Color Mix: preserve skin/oranges, calm greens/yellows,
              # keep sky/water clean.
              for center, hs, ss, ls, width in [
                  (0.00, 0.00, 0.010, 0.008, 0.055),  # red
                  (0.055,-0.008,0.015, 0.035,0.060),  # orange
                  (0.145,-0.025,-0.035,0.035,0.075),  # yellow
                  (0.30,-0.035,-0.055,0.040,0.105),  # green
                  (0.50,-0.015,0.020,0.025,0.085),  # aqua
                  (0.62,-0.020,-0.025,0.030,0.090),  # blue
                  (0.75,0.000,-0.020,0.015,0.070),  # purple
                  (0.88,0.000,-0.015,0.015,0.070),  # magenta
              ]:
                  a = hsl_adjust(a, hs, ss, ls, center, width)

              # Vibrance +12, Saturation +2.
              arr=a/255.0
              mx=arr.max(axis=2); mn=arr.min(axis=2)
              sat=np.divide(mx-mn, np.maximum(mx,1e-6))
              vib=1 + 0.12*(1-sat)
              grey=arr.mean(axis=2,keepdims=True)
              arr=np.clip(grey+(arr-grey)*vib[:,:,None],0,1)
              arr=np.clip(grey+(arr-grey)*1.02,0,1)
              out=Image.fromarray((arr*255).astype(np.uint8),"RGB")

              # Effects: Texture +5, Clarity +4, Dehaze +2.
              detail = out.filter(ImageFilter.UnsharpMask(radius=1.2, percent=55, threshold=3))
              out = Image.blend(out, detail, 0.12)
              blur = out.filter(ImageFilter.GaussianBlur(radius=5))
              out = Image.blend(out, ImageEnhance.Contrast(blur).enhance(1.035), 0.22)

              # Very restrained vignette (-4), avoiding crushed faces/bright centres.
              yy,xx=np.mgrid[0:out.height,0:out.width]
              dx=(xx-out.width/2)/(out.width/2)
              dy=(yy-out.height/2)/(out.height/2)
              edge=np.clip((dx*dx+dy*dy-0.25)/0.75,0,1)
              edge=0.035*edge**1.4
              oa=np.asarray(out).astype(np.float32)/255
              oa*= (1-edge[:,:,None])
              out=Image.fromarray(np.clip(oa*255,0,255).astype(np.uint8),"RGB")

              # Detail: Sharpen 45 / Radius 1 / Detail 25 equivalent.
              out=out.filter(ImageFilter.UnsharpMask(radius=1.0, percent=45, threshold=2))
              out.save(path, "JPEG", quality=92, optimize=True, progressive=True)

          PY
      - name: Commit only home-scroll photographs
        run: |
          git config user.name "CIRS Photo Editor"
          git config user.email "photo-editor@users.noreply.github.com"
          git add assets/img/hrun/01-holi.jpg assets/img/hrun/02-window.jpg assets/img/hrun/03-campus.jpg assets/img/hrun/05-lab.jpg assets/img/hrun/06-swim.jpg assets/img/hrun/07-sparkler.jpg assets/img/hrun/08-candlelight.jpg assets/img/hrun/09-meditation.jpg assets/img/hrun/10-stage.jpg
          git diff --cached --quiet && exit 0
          git commit -m "chore: grade home scroll photos"
          git push

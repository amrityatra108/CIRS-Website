name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Validate the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # html-validate 11 requires node ^22.22.0 || >= 24.8.0. npm only warns on
      # an engine mismatch and installs anyway, which surfaces much later as a
      # TypeError on a missing built-in — so pin a supported major here and let
      # --engine-strict fail the install loudly if that ever drifts apart again.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install html-validate
        run: npm install --no-save --engine-strict html-validate@11

      # Structural and accessibility validity: nesting, unclosed elements,
      # duplicate ids, missing alt text, ARIA correctness. Configured in
      # .htmlvalidate.json, which turns off exactly one rule — no-autoplay,
      # because the hero background is a muted, looping, decorative video
      # marked aria-hidden, and that rule guards against media that starts
      # making noise at a visitor.
      - name: Validate HTML
        run: npx html-validate *.html

      # Every in-page anchor and every assets/ path, checked against what is
      # actually in the repository. Offline by design — see the script.
      - name: Check links and asset references
        run: python3 tools/check-links.py

      # Every page at the repository root is generated by tools/build-site.py
      # from tools/partials/ and tools/pages/. Editing a generated page by hand
      # looks like it works and is silently undone by the next build — and the
      # menu, which appears on all ten pages, is exactly the thing someone
      # would be tempted to fix in one file. So rebuild here and fail if the
      # result differs from what was committed.
      #
      # cirs-editor.html is deliberately not checked: it is parked, not built
      # by default and not committed. If it comes back, add it here too — an
      # unchecked committed bundle rots without anyone noticing.
      - name: Check the generated pages are current
        run: |
          python3 tools/build-site.py
          if ! git diff --quiet -- '*.html'; then
            echo "::error::The committed pages do not match what tools/build-site.py produces."
            echo "Edit tools/partials/ or tools/pages/, run 'python3 tools/build-site.py', and commit."
            git diff --stat -- '*.html'
            exit 1
          fi
          echo "All pages match their sources."

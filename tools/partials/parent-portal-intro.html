<section class="portal-intro" id="portal-intro" aria-label="Parent Portal opening" data-ground="#11110F">
  <div class="portal-intro__inner">
    <p class="portal-intro__label">CIRS / Parents</p>
    <div class="portal-intro__stage">
      <div class="portal-intro__photo">
        <picture class="portal-intro__picture">
          <source media="(max-width:700px)" type="image/webp"
                  srcset="assets/img/parent-portal/reading-mobile-560.webp 560w, assets/img/parent-portal/reading-mobile-960.webp 960w"
                  sizes="calc(100vw - 40px)">
          <source media="(max-width:700px)" type="image/jpeg"
                  srcset="assets/img/parent-portal/reading-mobile-960.jpg 960w"
                  sizes="calc(100vw - 40px)">
          <source media="(max-width:900px) and (max-aspect-ratio:1/1)" type="image/webp"
                  srcset="assets/img/parent-portal/reading-tablet-960.webp 960w, assets/img/parent-portal/reading-tablet-1600.webp 1600w"
                  sizes="84vw">
          <source type="image/webp"
                  srcset="assets/img/parent-portal/reading-wide-1200.webp 1200w, assets/img/parent-portal/reading-wide-2000.webp 2000w, assets/img/parent-portal/reading-wide-2600.webp 2600w"
                  sizes="(max-width:1500px) 84vw, 1320px">
          <img class="portal-intro__image" src="assets/img/parent-portal/reading-wide-2000.jpg"
               width="2000" height="930"
               alt="An adult helps a child read a booklet during CIRS new student and parent orientation"
               fetchpriority="high" decoding="async">
        </picture>
      </div>
      <span class="portal-intro__line" aria-hidden="true"></span>
      <p class="portal-intro__title"><span class="portal-intro__title-word"><span>Parent</span></span><span class="portal-intro__title-word"><span>Portal</span></span></p>
    </div>
    <div class="portal-intro__after">
      <p class="portal-intro__note">Fee payment, parent login, and direct school contacts.</p>
      <a class="portal-intro__entry" href="#portal">
        <svg class="portal-intro__entry-border" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"><rect x="0.5" y="0.5" width="99" height="99" pathLength="1"/></svg>
        <span>Enter the portal</span><span class="portal-intro__entry-arrow" aria-hidden="true">&#8599;</span>
      </a>
    </div>
  </div>
</section>

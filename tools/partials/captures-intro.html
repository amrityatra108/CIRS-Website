<!-- The opening of CIRS Captures: six seconds of a camera coming out of the
     dark, which the visitor scrubs frame by frame with the scroll. Nothing
     here plays by itself and nothing here is a hero — the film is the whole
     introduction, and the one line of type arrives only once it has ended.

     The scroll distance is set in assets/css/captures.css and divided into
     its four phases in assets/js/captures.js. The markup is deliberately
     this bare: every element below is either the film or the line. -->
<section class="cap" id="captures-opening" data-captures>
  <div class="cap__stage">
    <video class="cap__film" data-captures-film
           width="1280" height="720"
           poster="assets/img/captures-camera-poster.jpg"
           preload="auto" muted playsinline disablepictureinpicture
           aria-hidden="true" tabindex="-1">
      <!-- H.264 first, which is the other way round from the rest of this
           site. Here the file is not played but seeked, several times a
           second, and H.264 is the one codec every browser that has it
           decodes in hardware — so it is the path that scrubs without
           stuttering wherever it exists. The VP9 is for the browsers built
           without the proprietary decoder, which would otherwise have no
           opening at all. Both are six seconds at 24fps, so the mapping in
           captures.js holds whichever one is picked. -->
      <source src="assets/video/captures-camera.mp4" type="video/mp4">
      <source src="assets/video/captures-camera.webm" type="video/webm">
    </video>
    <h1 class="cap__title" data-captures-title><span class="cap__line">CIRS Captures</span></h1>
  </div>
</section>
<div class="cap__seam" aria-hidden="true"></div>

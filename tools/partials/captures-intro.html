<!-- The opening of CIRS Captures: six seconds of a camera coming out of the
     dark, which the visitor scrubs frame by frame with the scroll. Nothing
     here plays by itself and nothing here is a hero — the film is the whole
     introduction, and the one line of type arrives only once it has ended.
     After it has been read, a photograph from the school appears inside the
     camera's lens and opens out of it to fill the window.

     The scroll distance is set in assets/css/captures.css and divided into
     its phases by data-captures-phases, which assets/js/captures.js reads:
     the film ends, it is held, the line arrives, the line is read, the
     photograph appears in the lens, and it has opened to the full window.
     The fractions come from lengths in the stylesheet, so change them
     together.

     data-captures-lens is the lens's front rim in the film's final frame,
     in the film's own pixels (1280 by 720): centre, the two radii, and the
     tilt of the ellipse in degrees. The script turns it into window
     coordinates for whatever crop the window gives the film, which is how
     the photograph lands exactly in the lens on every shape of screen.
     tools/make-captures-shot.py says how it was measured. -->
<section class="cap" id="captures-opening" data-captures
         data-captures-phases="0.5143 0.5657 0.6612 0.7347 0.7959 0.9388"
         data-captures-lens="388.4 359.3 65 124.4 6.56">
  <div class="cap__stage">
    <video class="cap__film" data-captures-film
           width="1280" height="720"
           poster="assets/img/captures-camera-poster.jpg"
           preload="auto" muted playsinline disablepictureinpicture
           aria-hidden="true" tabindex="-1">
      <!-- H.264 first, which is the other way round from the rest of this
           site. Here the file is not played but seeked, several times a
           second, and H.264 is the one codec every browser that has it
           decodes in hardware — so it is the path that scrubs without
           stuttering wherever it exists. The VP9 is for the browsers built
           without the proprietary decoder, which would otherwise have no
           opening at all. Both are six seconds at 24fps, so the mapping in
           captures.js holds whichever one is picked. -->
      <source src="assets/video/captures-camera.mp4" type="video/mp4">
      <source src="assets/video/captures-camera.webm" type="video/webm">
    </video>
    <h1 class="cap__title" data-captures-title><span class="cap__line">CIRS Captures</span></h1>
    <!-- After the line in the document so it is read after it, and over it
         on screen by z-index. Two cuts of one photograph: the portrait one
         wherever the window is no wider than 6:5, which is the same boundary
         the film's own crop changes at. -->
    <div class="cap__shot" data-captures-shot>
      <picture>
        <source media="(max-aspect-ratio: 6/5)"
                srcset="assets/img/captures-shot-portrait.jpg" width="1620" height="2160">
        <img class="cap__photo" src="assets/img/captures-shot.jpg" width="2400" height="1819"
             alt="A CIRS student dancing on stage in red, one arm raised"
             loading="lazy" decoding="async">
      </picture>
    </div>
  </div>
</section>

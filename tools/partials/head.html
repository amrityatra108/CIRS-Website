<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="#0E0B12">
<link rel="canonical" href="https://www.cirschool.org/{{CANONICAL}}">
<!-- The crest, with its own transparent ground — cut by tools/make-favicon.py
     from assets/img/logo.png. The JPEG these replaced could not hold an alpha
     channel, so the round crest arrived in the tab baked onto a white square.
     The touch icon alone is opaque, on the theme-color above, because iOS
     composites a transparent one onto black. -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon-180.png">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:image" content="assets/img/og.jpg">
<meta property="og:locale" content="en_IN">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="assets/img/og.jpg">
<!-- Four approved families, self-hosted with retained OFL notices. -->
<link rel="preload" href="assets/fonts/newsreader-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/fonts.css?{{CACHE_BUST}}">
<link rel="stylesheet" href="assets/css/cirs.css?{{CACHE_BUST}}">
<link rel="stylesheet" href="assets/css/pages.css?{{CACHE_BUST}}">
<!-- The opening curtain is a fixed, opaque, full-window panel that cirs.js
     removes once it has played. With scripting off nothing removes it, and
     it covers the page on every page of this site. One rule, applied only
     when there is no scripting, is the whole fix. Crossroads already does
     this for its own curtain further down. The footer rule is the same
     kind of fallback: cirs.js unpins a footer taller than the window, and
     without it a phone could never scroll up to the top of the footer. -->
<noscript><style>.curtain{display:none}.footer-wrap{position:relative}</style></noscript>
</head>

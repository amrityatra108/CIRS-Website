<!-- Opening sequence. Removed from the DOM once it has played. -->
<div class="curtain" id="curtain" aria-hidden="true">
  <img src="assets/img/logo.png" alt="" width="72" height="70">
  <p class="curtain__deva" lang="sa">&#2332;&#2381;&#2334;&#2366;&#2344;&#2306; &#2360;&#2375;&#2357;&#2366; &#2330; &#2325;&#2380;&#2358;&#2354;&#2350;&#2381;</p>
  <p class="curtain__en">Knowledge &middot; Service &middot; Efficiency</p>
  <span class="curtain__bar"><i></i></span>
</div>

<!-- Film lightbox, shared by every page. The iframe is built on open and
     destroyed on close: nothing is requested from YouTube until someone asks
     for the film, and removing the element is what actually stops the audio. -->
<dialog class="lightbox" id="lightbox" aria-label="The official CIRS film" hidden>
  <div class="lightbox__back" data-close></div>
  <div class="lightbox__panel">
    <div class="lightbox__frame" id="lightboxFrame"></div>
    <button type="button" class="lightbox__close" data-close aria-label="Close the film">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 3.5l9 9m0-9l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
  <!-- Escape is caught by the player while it has focus, and a page cannot
       reach into a cross-origin frame to take it back, so the way out is
       said once, quietly, under the film. -->
  <p class="lightbox__hint" aria-hidden="true"><span class="lightbox__hint-key">Press Esc or click outside the film to close</span><span class="lightbox__hint-touch">Tap outside the film to close</span></p>
</dialog>

<div class="progress" id="progress" aria-hidden="true"></div>
<div class="ring" id="ring" aria-hidden="true"></div>

<button type="button" class="totop" id="totop" aria-label="Back to top">
  <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
    <path d="M7 13V1M1.5 6.5L7 1l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </svg>
</button>

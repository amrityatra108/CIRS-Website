<header class="header" id="header">
  <div class="wrap">
    <div class="header__left">
      <!-- Enquire opens the contact panel below rather than going anywhere.
           It stays a button so the keyboard and screen readers get a control
           that announces its expanded state; hover opens it for a mouse. -->
      <div class="enq" id="enq">
        <button type="button" class="htab enq__btn" id="enqBtn" data-magnetic aria-label="Enquire"
                aria-expanded="false" aria-controls="enqPanel">
          <span class="htab__icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7.6" stroke="currentColor" stroke-width="1.25"/><path d="M9 8.1v4.3M9 5.6h.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </span>
          <span class="htab__label">Enquire</span>
        </button>

        <div class="enq__panel" id="enqPanel">
          <p class="enq__title sc">Talk to CIRS</p>

          <a class="enq__row enq__row--wa" href="https://wa.me/919360461572"
             target="_blank" rel="noopener">
            <span class="enq__ico" aria-hidden="true">
              <svg width="19" height="19" viewBox="0 0 22 22" fill="none"><path d="M3.4 18.6l1.1-3.9a7.6 7.6 0 1 1 2.9 2.8l-4 1.1Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8.3 8.1c.2-.5.5-.5.8-.5h.5c.2 0 .4 0 .6.5l.6 1.4c.1.2 0 .4-.1.6l-.4.4c-.1.2-.2.3-.1.5.3.6 1.1 1.5 1.9 1.9.2.1.4 0 .5-.1l.5-.5c.2-.2.3-.2.5-.1l1.4.7c.2.1.3.3.3.5v.5c0 .5-.4.9-.9 1-1.6.2-3.9-1.3-5.2-3.4-.7-1.1-1-2.3-.9-3.4Z" fill="currentColor"/></svg>
            </span>
            <span class="enq__txt">
              <b>+91 93604 61572</b>
              <small>WhatsApp &middot; Admissions Coordinator</small>
            </span>
          </a>

          <a class="enq__row" href="mailto:info@cirschool.org">
            <span class="enq__ico" aria-hidden="true">
              <svg width="19" height="19" viewBox="0 0 22 22" fill="none"><rect x="2.6" y="4.6" width="16.8" height="12.8" rx="1.6" stroke="currentColor" stroke-width="1.4"/><path d="m3.4 5.8 7.6 5.6 7.6-5.6" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            </span>
            <span class="enq__txt">
              <b>info@cirschool.org</b>
              <small>Email the school</small>
            </span>
          </a>

          <!-- The three doors. Each goes to the page that explains what is
               live and what is not, rather than straight out to the external
               system — a parent who lands on a login screen with no warning
               cannot tell the school's old system from the new site.

               They carry no second line. "Through the Parent Portal" under
               two rows that both went to the Parent Portal was restating the
               destination the row already is, and it made three plain doors
               look like three explanations. -->
          <p class="enq__title enq__title--sep sc">Portals</p>

          <a class="enq__row" href="parent-portal.html">
            <span class="enq__ico" aria-hidden="true">
              <svg width="19" height="19" viewBox="0 0 22 22" fill="none"><rect x="2.6" y="5.2" width="16.8" height="11.6" rx="1.8" stroke="currentColor" stroke-width="1.4"/><path d="M2.6 9.4h16.8" stroke="currentColor" stroke-width="1.4"/><path d="M5.6 13.4h3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </span>
            <span class="enq__txt">
              <b>Fee payment</b>
            </span>
          </a>

          <a class="enq__row" href="parent-portal.html">
            <span class="enq__ico" aria-hidden="true">
              <svg width="19" height="19" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="7.8" r="3.2" stroke="currentColor" stroke-width="1.4"/><path d="M4.8 18.4a6.2 6.2 0 0 1 12.4 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </span>
            <span class="enq__txt">
              <b>Parent Login</b>
            </span>
          </a>

          <a class="enq__row" href="https://cirs.in/school/cirsmark/"
             target="_blank" rel="noopener">
            <span class="enq__ico" aria-hidden="true">
              <svg width="19" height="19" viewBox="0 0 22 22" fill="none"><path d="M11 4.4 19.6 8 11 11.6 2.4 8 11 4.4Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5.8 10v4.4c0 1.3 2.3 2.4 5.2 2.4s5.2-1.1 5.2-2.4V10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </span>
            <span class="enq__txt">
              <b>Student Login</b>
            </span>
          </a>

          <p class="enq__title enq__title--sep sc">Follow CIRS</p>
          <div class="enq__social">
            <a href="https://www.instagram.com/cirschool" target="_blank" rel="noopener"
               aria-label="Instagram (opens in a new tab)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.25"/><circle class="enq__social-dot" cx="17.4" cy="6.7" r="1.1"/></svg>
            </a>
            <a href="https://www.facebook.com/CIRS.Coimbatore" target="_blank" rel="noopener"
               aria-label="Facebook (opens in a new tab)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.7 21v-8h2.8l.45-3.2H13.7V7.75c0-.93.3-1.56 1.64-1.56H17V3.3a22 22 0 0 0-2.43-.13c-2.4 0-4.05 1.47-4.05 4.17V9.8H7.8V13h2.72v8h3.18Z"/></svg>
            </a>
            <a href="https://www.youtube.com/@CIRS-YouTube" target="_blank" rel="noopener"
               aria-label="YouTube (opens in a new tab)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8.15a3 3 0 0 0-2.1-2.12C17.05 5.5 12 5.5 12 5.5s-5.05 0-6.9.53A3 3 0 0 0 3 8.15a31 31 0 0 0 0 7.7 3 3 0 0 0 2.1 2.12c1.85.53 6.9.53 6.9.53s5.05 0 6.9-.53a3 3 0 0 0 2.1-2.12 31 31 0 0 0 0-7.7Z"/><path class="enq__social-play" d="m10 15.25 5-3.25-5-3.25v6.5Z"/></svg>
            </a>
            <a href="https://in.linkedin.com/school/chinmaya-international-residential-school/" target="_blank" rel="noopener"
               aria-label="LinkedIn (opens in a new tab)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 8.4H3.3V21h3.3V8.4ZM5 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8.2 5.4H10V21h3.2v-6.25c0-1.65.32-3.25 2.37-3.25 2.02 0 2.05 1.9 2.05 3.36V21H21v-6.92c0-3.4-.73-6.01-4.7-6.01-1.9 0-3.18 1.04-3.7 2.02h-.04V8.4h.64Z"/></svg>
            </a>
          </div>
        </div>
      </div>
      {{HOME_TAB}}
    </div>

    <a class="brand" href="{{BRAND_HREF}}" aria-label="Chinmaya International Residential School home">
      <img src="assets/img/logo.png" alt="Chinmaya International Residential School emblem" width="64" height="63">
      <span class="brand__txt">
        <span class="brand__name">Chinmaya International Residential School</span>
        <span class="brand__sub">Siruvani &middot; Coimbatore &middot; Founded 1996</span>
      </span>
    </a>

    <div class="header__right">
{{HEADER_TABS}}      <a class="htab htab--news" href="news.html" data-magnetic>
        <span class="htab__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2.4 3.6h9.4v10.8H3.6a1.2 1.2 0 0 1-1.2-1.2V3.6Z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M11.8 6.6h3.8v6.6a1.2 1.2 0 0 1-1.2 1.2h-2.6" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M4.8 6.4h4.6M4.8 9h4.6M4.8 11.6h2.8" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/></svg>
        </span>
        <span class="htab__label">News</span>
      </a>
      <button type="button" class="htab htab--menu" id="burger" aria-expanded="false" aria-controls="drawer" aria-label="Open menu" data-magnetic>
        <span class="htab__icon" aria-hidden="true">
          <span class="menubtn__dots"><i></i><i></i><i></i><i></i></span>
        </span>
        <span class="htab__label">Menu</span>
      </button>
    </div>
  </div>
</header>

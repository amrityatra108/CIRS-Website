<header class="header" id="header">
  <div class="wrap">
    <div class="header__left">
      <!-- Enquire opens the contact panel below rather than going anywhere.
           It stays a button so the keyboard and screen readers get a control
           that announces its expanded state; hover opens it for a mouse. -->
      <div class="enq" id="enq">
        <button type="button" class="htab enq__btn" id="enqBtn"
                aria-expanded="false" aria-controls="enqPanel">
          <span class="htab__icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7.6" stroke="currentColor" stroke-width="1.25"/><path d="M9 8.1v4.3M9 5.6h.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </span>
          <span class="htab__label">Enquire</span>
        </button>

        <div class="enq__panel" id="enqPanel">
          <p class="enq__title sc">Talk to CIRS</p>

          <a class="enq__row enq__row--wa" href="https://wa.me/919360461572"
             target="_blank" rel="noopener">
            <span class="enq__ico" aria-hidden="true">
              <svg width="19" height="19" viewBox="0 0 22 22" fill="none"><path d="M3.4 18.6l1.1-3.9a7.6 7.6 0 1 1 2.9 2.8l-4 1.1Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8.3 8.1c.2-.5.5-.5.8-.5h.5c.2 0 .4 0 .6.5l.6 1.4c.1.2 0 .4-.1.6l-.4.4c-.1.2-.2.3-.1.5.3.6 1.1 1.5 1.9 1.9.2.1.4 0 .5-.1l.5-.5c.2-.2.3-.2.5-.1l1.4.7c.2.1.3.3.3.5v.5c0 .5-.4.9-.9 1-1.6.2-3.9-1.3-5.2-3.4-.7-1.1-1-2.3-.9-3.4Z" fill="currentColor"/></svg>
            </span>
            <span class="enq__txt">
              <b>+91 93604 61572</b>
              <small>WhatsApp &middot; Admissions Coordinator</small>
            </span>
          </a>

          <a class="enq__row" href="mailto:info@cirschool.org">
            <span class="enq__ico" aria-hidden="true">
              <svg width="19" height="19" viewBox="0 0 22 22" fill="none"><rect x="2.6" y="4.6" width="16.8" height="12.8" rx="1.6" stroke="currentColor" stroke-width="1.4"/><path d="m3.4 5.8 7.6 5.6 7.6-5.6" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            </span>
            <span class="enq__txt">
              <b>info@cirschool.org</b>
              <small>Email the school</small>
            </span>
          </a>

          <p class="enq__title enq__title--social sc">Follow CIRS</p>
          <div class="enq__social">
            <a href="https://www.instagram.com/cirschool" target="_blank" rel="noopener">Instagram</a>
            <a href="https://www.facebook.com/CIRS.Coimbatore" target="_blank" rel="noopener">Facebook</a>
            <a href="https://www.youtube.com/@CIRS-YouTube" target="_blank" rel="noopener">YouTube</a>
            <a href="https://in.linkedin.com/school/chinmaya-international-residential-school/" target="_blank" rel="noopener">LinkedIn</a>
          </div>
        </div>
      </div>
      {{HOME_TAB}}
    </div>

    <a class="brand" href="#top">
      <img src="assets/img/logo.png" alt="Chinmaya International Residential School emblem" width="64" height="63">
      <span class="brand__txt">
        <span class="brand__name">Chinmaya International Residential School</span>
        <span class="brand__sub">Siruvani &middot; Coimbatore &middot; Founded 1996</span>
      </span>
    </a>

    <div class="header__right">
      <a class="htab htab--news" href="news.html">
        <span class="htab__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2.4 3.6h9.4v10.8H3.6a1.2 1.2 0 0 1-1.2-1.2V3.6Z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M11.8 6.6h3.8v6.6a1.2 1.2 0 0 1-1.2 1.2h-2.6" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M4.8 6.4h4.6M4.8 9h4.6M4.8 11.6h2.8" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/></svg>
        </span>
        <span class="htab__label">News</span>
      </a>
      <button type="button" class="htab htab--menu" id="burger" aria-expanded="false" aria-controls="drawer" aria-label="Open menu">
        <span class="htab__icon" aria-hidden="true">
          <span class="menubtn__dots"><i></i><i></i><i></i><i></i></span>
        </span>
        <span class="htab__label">Menu</span>
      </button>
    </div>
  </div>
</header>

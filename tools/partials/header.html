<header class="header" id="header">
  <div class="wrap">
    <div class="header__left">
      <a class="htab" href="#admissions">
        <span class="htab__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7.6" stroke="currentColor" stroke-width="1.25"/><path d="M9 8.1v4.3M9 5.6h.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </span>
        <span class="htab__label">Enquire</span>
      </a>
      {{HOME_TAB}}
    </div>

    <a class="brand" href="#top">
      <img src="assets/img/logo.png" alt="Chinmaya International Residential School emblem" width="64" height="63">
      <span class="brand__txt">
        <span class="brand__name">Chinmaya International Residential School</span>
        <span class="brand__sub">Siruvani &middot; Coimbatore &middot; Founded 1996</span>
      </span>
    </a>

    <div class="header__right">
      <a class="htab htab--news" href="news.html">
        <span class="htab__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2.4 3.6h9.4v10.8H3.6a1.2 1.2 0 0 1-1.2-1.2V3.6Z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M11.8 6.6h3.8v6.6a1.2 1.2 0 0 1-1.2 1.2h-2.6" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M4.8 6.4h4.6M4.8 9h4.6M4.8 11.6h2.8" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/></svg>
        </span>
        <span class="htab__label">News</span>
      </a>
      <button type="button" class="htab htab--menu" id="burger" aria-expanded="false" aria-controls="drawer" aria-label="Open menu">
        <span class="htab__icon" aria-hidden="true">
          <span class="menubtn__dots"><i></i><i></i><i></i><i></i></span>
        </span>
        <span class="htab__label">Menu</span>
      </button>
    </div>
  </div>
</header>
